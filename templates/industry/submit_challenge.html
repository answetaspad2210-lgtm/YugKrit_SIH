{% extends "industry/_base.html" %}
{% block title %}Submit Challenge — {{ app_name }}{% endblock %}
{% block dashboard_content %}
<div class="page-header"><div><h1>Submit a Challenge</h1><p>Send a real societal problem to Government and the IT Cell for verification.</p></div></div>
<div class="card card-body"><form method="post" enctype="multipart/form-data">
  <div class="form-row"><div class="form-group"><label>Problem Title *</label><input name="title" required></div><div class="form-group"><label>Problem Category *</label><select name="category" required><option value="">Select category</option>{% for category in categories %}<option value="{{ category }}">{{ category }}</option>{% endfor %}</select></div></div>
  <div class="form-row"><div class="form-group"><label>Student-solvable sub-category *</label><select name="subcategory" id="industry-subcategory" required disabled><option value="">Choose a category first</option></select></div><div class="form-group"><label>Urgency</label><select name="urgency"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div></div>
  <div class="form-group"><label>Problem Description *</label><textarea name="description" rows="4" required></textarea></div>
  <div class="form-row"><div class="form-group"><label>Current Situation</label><textarea name="current_situation" rows="3"></textarea></div><div class="form-group"><label>Expected Outcome / Impact</label><textarea name="expected_outcome" rows="3"></textarea></div></div>
  <div class="form-row"><div class="form-group"><label>Location</label><input name="location"></div><div class="form-group"><label>District</label><input name="district"></div><div class="form-group"><label>State</label><input name="state"></div></div>
  <div class="form-row"><div class="form-group"><label>Affected Community / Population</label><input name="affected_population" type="number" min="0" value="0"></div><div class="form-group"><label>Evidence</label><input name="evidence" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.mp4,.docx,.xlsx"></div></div>
  <button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit for Verification</button>
</form></div>
{% endblock %}
{% block extra_js %}
<script>
  const industrySubcategories = {{ subcategories|tojson }};
  const industryCategory = document.querySelector('select[name="category"]');
  const industrySubcategory = document.getElementById("industry-subcategory");
  industryCategory.addEventListener("change", () => {
    const values = industrySubcategories[industryCategory.value] || [];
    industrySubcategory.innerHTML = '<option value="">Choose a subcategory</option>' + values.map(value => `<option value="${value}">${value}</option>`).join("");
    industrySubcategory.disabled = values.length === 0;
  });
</script>
{% endblock %}
