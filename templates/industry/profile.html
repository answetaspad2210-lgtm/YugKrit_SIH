{% extends "industry/_base.html" %}
{% block title %}Organization Profile — {{ app_name }}{% endblock %}
{% block dashboard_content %}<div class="page-header"><div><h1>Organization Capability Profile</h1><p>{{ industry.organization.name }}</p></div></div><div class="card card-body" style="max-width:800px"><div class="detail-list"><div class="row"><span class="label">Sector</span><span class="value">{{ industry.sector }}</span></div><div class="row"><span class="label">Organization Type</span><span class="value">{{ industry.organization_type }}</span></div></div><form method="post"><div class="form-group"><label>Description</label><textarea name="description">{{ industry.description or '' }}</textarea></div><div class="form-group"><label>Sub-sector</label><input name="sub_sector" value="{{ industry.sub_sector or '' }}"></div><div class="form-group"><label>Expertise</label><input name="expertise" value="{{ industry.expertise or '' }}"></div><div class="form-group"><label>Technologies</label><input name="technologies" value="{{ industry.technologies or '' }}"></div><div class="form-group"><label>Services</label><input name="services" value="{{ industry.services or '' }}"></div><div class="form-group"><label>CSR Focus Areas</label><input name="csr_focus_areas" value="{{ industry.csr_focus_areas or '' }}"></div><div class="form-group"><label>Available Resources</label><input name="available_resources" value="{{ industry.available_resources or '' }}"></div><button class="btn btn-primary">Save Profile</button></form></div>{% endblock %}
