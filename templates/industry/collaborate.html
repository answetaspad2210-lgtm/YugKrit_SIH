{% extends "industry/_base.html" %}
{% block title %}Collaboration Proposal — {{ app_name }}{% endblock %}
{% block dashboard_content %}<div class="page-header"><div><h1>Collaboration Proposal</h1><p>{{ challenge.title }}{% if project %} · {{ project.name }}{% endif %}</p></div></div><div class="card card-body" style="max-width:800px"><form method="post"><input type="hidden" name="project_id" value="{{ project.id if project else '' }}"><div class="form-group"><label>Proposal Type</label><select name="proposal_type"><option>Technical partnership</option><option>CSR support</option><option>Pilot implementation</option><option>Research partnership</option></select></div><div class="form-group"><label>Support Offered *</label><div class="form-row">{% for support in support_types %}<label><input type="checkbox" name="support_types" value="{{ support }}"> {{ support }}</label>{% endfor %}</div></div><div class="form-group"><label>Proposal Description *</label><textarea name="description" required></textarea></div><div class="form-row"><div class="form-group"><label>Estimated Contribution</label><input name="estimated_contribution"></div><div class="form-group"><label>Expected Duration</label><input name="expected_duration" placeholder="e.g. 6 months"></div></div><div class="form-row"><div class="form-group"><label>Available Experts</label><input name="experts"></div><div class="form-group"><label>Budget (optional)</label><input name="budget" type="number" min="0" step="0.01"></div></div><button class="btn btn-primary btn-block">Submit Proposal</button></form></div>{% endblock %}
