{% extends "government/_base.html" %}
{% block title %}Analytics — {{ app_name }}{% endblock %}
{% block dashboard_content %}
<div class="page-header"><div><h1>Analytics</h1><p>Challenge distribution across categories and statuses.</p></div></div>

<div class="grid-2">
  <div class="card card-body chart-card">
    <h3>Challenges by Category</h3>
    <canvas data-chart='{
      "type": "bar",
      "label": "Challenges",
      "labels": {{ by_category | map(attribute=0) | list | tojson }},
      "dataset": {"data": {{ by_category | map(attribute=1) | list | tojson }}}
    }'></canvas>
  </div>
  <div class="card card-body chart-card">
    <h3>Challenges by Status</h3>
    <canvas data-chart='{
      "type": "doughnut",
      "label": "Status",
      "labels": {{ by_status | map(attribute=0) | list | tojson }},
      "dataset": {"data": {{ by_status | map(attribute=1) | list | tojson }}},
      "showLegend": true
    }'></canvas>
  </div>
</div>
{% endblock %}
