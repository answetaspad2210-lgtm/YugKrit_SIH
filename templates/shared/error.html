{% extends "base.html" %}
{% block title %}Error {{ code }} — {{ app_name }}{% endblock %}
{% block content %}
<div class="section">
  <div class="container empty-state">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <h2>Error {{ code }}</h2>
    <p>{{ message }}</p>
    <a href="{{ url_for('public.home') }}" class="btn btn-primary" style="margin-top:14px;">Go to Homepage</a>
  </div>
</div>
{% endblock %}
